spring.application.name=campusfix
server.port=${PORT:5000}

# ---- Database: H2 file database (works with no setup) ----
spring.datasource.url=jdbc:h2:file:./data/campusfix
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# ---- To use MySQL instead: comment the 4 lines above, uncomment below ----
# spring.datasource.url=jdbc:mysql://localhost:3306/campusfix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.hibernate.ddl-auto=update

# ---- App settings (can be overridden with environment variables) ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
# Anyone who registers with this code becomes an admin
app.admin-code=${ADMIN_CODE:anurag-admin-2026}
app.client-url=${CLIENT_URL:http://localhost:5173}
app.upload-dir=uploads

# ---- File upload limits ----
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
